name: APK derle

on:
  push:
    branches: [main]
    paths-ignore:
      - "server/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: İmzalama anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.BAYX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bayx.jks"
            echo "BAYX_KEYSTORE_FILE=$RUNNER_TEMP/bayx.jks" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEY=1" >> "$GITHUB_ENV"
            echo "Gizli anahtar var: yayın sürümü de derlenecek."
          else
            echo "Gizli anahtar tanımlı değil; yalnızca test sürümü derlenecek (sabit test anahtarıyla)."
          fi
      - name: Debug APK derle
        env:
          BAYX_KEYSTORE_PASS: ${{ secrets.BAYX_KEYSTORE_PASS }}
        run: gradle :app:assembleDebug --stacktrace
      - name: Ekran görüntüleri (tasarım kontrolü)
        continue-on-error: true
        run: gradle :app:recordRoborazziDebug --stacktrace
      - name: Ekran görüntülerini ekranlar dalına koy
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          set -e
          [ -d app/build/outputs/roborazzi ] || exit 0
          D="$RUNNER_TEMP/ekranlar"; mkdir -p "$D"; cp app/build/outputs/roborazzi/*.png "$D"/
          cd "$D"; git init -q; git checkout -q -b ekranlar
          git -c user.name=ci -c user.email=ci@localhost add . 
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Ekran görüntüleri $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ekranlar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tayfa-ekranlar
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore
      - name: Yayın APK derle
        if: env.HAS_RELEASE_KEY == '1'
        env:
          BAYX_KEYSTORE_PASS: ${{ secrets.BAYX_KEYSTORE_PASS }}
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_KEY == '1'
        with:
          name: tayfa-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tayfa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Güncellemeyi yayınla (sunucu buradan indirir, telefonlar sunucudan alır)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ "$HAS_RELEASE_KEY" = "1" ]; then APK=app/build/outputs/apk/release/app-release.apk; fi
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          D="$RUNNER_TEMP/yayin"; mkdir -p "$D"; cp "$APK" "$D/tayfa.apk"
          CODE="$CODE" NAME="$NAME" python3 - "$D" <<'PY'
          import hashlib, json, os, sys
          d = sys.argv[1]
          data = open(os.path.join(d, "tayfa.apk"), "rb").read()
          notes = open("app/surum-notu.txt", encoding="utf-8").read().strip() if os.path.exists("app/surum-notu.txt") else ""
          json.dump({
              "version_code": int(os.environ["CODE"]),
              "version_name": os.environ["NAME"],
              "sha256": hashlib.sha256(data).hexdigest(),
              "size": len(data),
              "notes": notes[:600],
          }, open(os.path.join(d, "surum.json"), "w", encoding="utf-8"), ensure_ascii=False)
          PY
          TAG="v$NAME-$CODE"
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$D/tayfa.apk" "$D/surum.json" --title "Tayfa $NAME" --notes-file app/surum-notu.txt --latest --target "$GITHUB_SHA"
