name: APK derle

on:
  push:
    branches: [main]
    paths-ignore:
      - "server/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: İmzalama anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.BAYX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bayx.jks"
            echo "BAYX_KEYSTORE_FILE=$RUNNER_TEMP/bayx.jks" >> "$GITHUB_ENV"
            echo "Kalıcı imzalama anahtarı kullanılacak."
          else
            echo "Kalıcı anahtar tanımlı değil; debug anahtarıyla imzalanacak."
          fi
      - name: Debug APK derle
        env:
          BAYX_KEYSTORE_PASS: ${{ secrets.BAYX_KEYSTORE_PASS }}
        run: gradle :app:assembleDebug --stacktrace
      - name: Ekran görüntüleri (tasarım kontrolü)
        continue-on-error: true
        run: gradle :app:recordRoborazziDebug --stacktrace
      - name: Ekran görüntülerini ekranlar dalına koy
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          set -e
          [ -d app/build/outputs/roborazzi ] || exit 0
          D="$RUNNER_TEMP/ekranlar"; mkdir -p "$D"; cp app/build/outputs/roborazzi/*.png "$D"/
          cd "$D"; git init -q; git checkout -q -b ekranlar
          git -c user.name=ci -c user.email=ci@localhost add . 
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Ekran görüntüleri $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ekranlar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tayfa-ekranlar
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: tayfa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
